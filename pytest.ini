[pytest]
pythonpath = .
testpaths = tests
# Default test collection EXCLUDES tests/integration/. Those tests
# hit real exchange APIs and are gated separately. To run them:
#   python -m pytest tests/integration/ -v -s
# (with the appropriate venue credentials in the environment).
# See tests/integration/README.md for the operator playbook.
norecursedirs = integration
# v1.4.200 / v1.4.204: suppress the BotState.working_bid /
# working_ask DeprecationWarning at the session level. Production
# code is fully migrated off these shims (v1.4.195); the only
# remaining emitters are test files that intentionally exercise the
# legacy property API (test_state_per_rung_working_orders.py — the
# shim's own behaviour test; test_phase3a6_working_bid_ask_deprecated.py
# — the deprecation-warning test itself; plus a handful of inline
# ``assert state.working_bid is X`` assertions in older test files
# that haven't been migrated).
#
# v1.4.204 fix: dropped the ``:app.state`` module qualifier. The
# deprecation ``warnings.warn(...)`` call uses ``stacklevel=2``, so
# the warning is attributed to the CALLER's module (typically a test
# file), NOT to ``app.state``. The original v1.4.200 module filter
# pattern matched nothing in practice — warnings leaked through on
# the next CI run with a different ordering. Drop the module filter
# entirely; rely on the precise message-text regex to scope.
#
# The deprecation-warning test (test_phase3a6_*) uses
# ``warnings.catch_warnings()`` + ``simplefilter("always")`` to
# override this filter when it needs the warning to fire — that
# pattern is unaffected by the global filter (catch_warnings saves
# and restores the filter list).
filterwarnings =
    ignore:BotState.working_(bid|ask) is deprecated:DeprecationWarning
